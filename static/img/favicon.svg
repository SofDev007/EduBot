<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>
  <!-- rounded orange tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- antenna -->
  <circle cx="32" cy="11" r="2.6" fill="#fff"/>
  <line x1="32" y1="13" x2="32" y2="19" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- side ears -->
  <rect x="10.5" y="30" width="5" height="10" rx="2.5" fill="#fff"/>
  <rect x="48.5" y="30" width="5" height="10" rx="2.5" fill="#fff"/>
  <!-- robot head -->
  <rect x="16" y="19" width="32" height="28" rx="9" fill="#fff"/>
  <!-- eyes -->
  <circle cx="25" cy="33" r="3.6" fill="#F4511E"/>
  <circle cx="39" cy="33" r="3.6" fill="#F4511E"/>
</svg>
